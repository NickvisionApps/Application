on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ "review_requested", "ready_for_review" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Git ref to check out"
        type: string
        required: true
      release_tag:
        description: "GitHub release tag to publish to; leave empty to only build"
        type: string
        required: false
        default: ""
      prerelease:
        type: boolean
        required: false
        default: false
      release_body:
        type: string
        required: false
        default: ""
name: macOS
permissions:
  id-token: write
  contents: write
jobs:
  tauri-macos:
    name: "Tauri on macOS"
    if: ${{ github.event.pull_request.user.login != 'weblate' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: "Setup environment"
        run: |
          brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ (inputs.release_tag != '' && 'release-') || '' }}${{ matrix.variant.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: "Install frontend dependencies"
        run: npm ci
      - name: "Build"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: "Application ${{ inputs.tag }}"
          releaseBody: ${{ inputs.release_body }}
          prerelease: ${{ inputs.prerelease == true }}
          retryAttempts: 3
          uploadWorkflowArtifacts: ${{ inputs.release_tag == '' }}
          workflowArtifactNamePattern: Application-${{ matrix.variant.arch }}
