on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ "review_requested", "ready_for_review" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Git ref to check out"
        type: string
        required: true
      release_tag:
        description: "GitHub release tag to publish to; leave empty to only build"
        type: string
        required: false
        default: ""
      prerelease:
        type: boolean
        required: false
        default: false
      release_body:
        type: string
        required: false
        default: ""
name: Windows
permissions:
  id-token: write
  contents: write
jobs:
  tauri-windows:
    name: "Tauri on Windows"
    if: ${{ github.event.pull_request.user.login != 'weblate' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x64
            runner: windows-latest
            subsys: mingw64
            type: x86_64
          - arch: arm64
            runner: windows-11-arm
            subsys: clangarm64
            type: clang-aarch64
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.variant.subsys }}
          install: mingw-w64-${{ matrix.variant.type }}-gettext-tools
      - name: "Setup environment"
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\${{ matrix.variant.subsys }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ (inputs.release_tag != '' && 'release-') || '' }}${{ matrix.variant.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: "Install frontend dependencies"
        run: npm ci
      - name: "Compute MSI version"
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $parts = $version -split '\.'
          $wixVersion = "$([int]$parts[0] - 2000).$($parts[1]).$($parts[2])"
          $conf = [ordered]@{
            '$schema' = 'https://schema.tauri.app/config/2'
            bundle = @{
              targets = @('msi')
              windows = @{
                wix = @{
                  version = $wixVersion
                }
              }
            }
          }
          $conf | ConvertTo-Json -Depth 10 | Set-Content -Path src-tauri/tauri.windows.conf.json
      - name: "Build"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: "Application ${{ inputs.tag }}"
          releaseBody: ${{ inputs.release_body }}
          prerelease: ${{ inputs.prerelease == true }}
          retryAttempts: 3
          uploadWorkflowArtifacts: ${{ inputs.release_tag == '' }}
          workflowArtifactNamePattern: Application-${{ matrix.variant.arch }}
